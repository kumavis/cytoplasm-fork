name: CI

on: [push, pull_request]

# the GITHUB_TOKEN handed to these jobs only ever needs to read the checkout
permissions:
  contents: read

# a new push supersedes whatever was already running for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the two current LTS lines; node 20 reached end-of-life in April 2026
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test
      # the suite runs against dist/ as well as src/, so a stale dist means half
      # the assertions are testing the previous implementation
      - name: Check dist is up to date
        run: |
          yarn build
          git diff --exit-code -- dist
      - name: Lint
        run: yarn lint

  performance:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      # the full comparison runs every implementation against every suite in its
      # own process and takes ~10 minutes; the quick preset keeps the cytoplasm
      # rows plus the controls needed to notice a machine-level change
      - name: Performance
        run: yarn performance:quick
